<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Local Taxi | Premium City Mobility</title>
    <meta name="description" content="Create your Local Taxi account to start booking premium rides instantly.">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body {
            min-height: 100vh;
            background: var(--secondary-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 16px 40px 16px;
            position: relative;
        }
        .auth-controls {
            position: fixed;
            top: 16px;
            inset-inline-end: 16px;
            display: flex;
            gap: 8px;
            z-index: 999;
        }
        .auth-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .auth-icon-btn:hover {
            border-color: var(--primary-accent);
            color: var(--primary-accent);
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 22px;
            color: var(--text-primary);
            text-decoration: none;
            margin-bottom: 6px;
        }
        .auth-logo i { font-size: 28px; color: var(--primary-accent); }
        .form-control {
            background: var(--secondary-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-primary) !important;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
        }
        .form-control:focus {
            border-color: var(--primary-accent) !important;
            box-shadow: 0 0 0 3px rgba(231,183,90,0.15) !important;
        }
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .password-wrapper { position: relative; }
        .password-wrapper .form-control { padding-right: 44px; }
        .eye-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            user-select: none;
            transition: color 0.2s ease;
        }
        .eye-toggle:hover { color: var(--primary-accent); }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 11px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--secondary-bg);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .social-btn:hover {
            border-color: var(--primary-accent);
            background: rgba(231,183,90,0.05);
            color: var(--text-primary);
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .auth-link {
            color: var(--primary-accent);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .auth-link:hover { text-decoration: underline; }
        .plain-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .plain-link:hover { text-decoration: underline; color: var(--text-primary); }
        .terms-link {
            color: var(--primary-accent);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .terms-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- RTL + Theme icons - fixed top-right -->
    <div class="auth-controls">
        <a href="#" class="auth-icon-btn js-theme-toggle" title="Toggle Theme">
            <i class="ph ph-moon"></i>
        </a>
        <a href="#" class="auth-icon-btn js-rtl-toggle" title="Toggle RTL" style="font-size: 12px; font-weight: 700; letter-spacing: 0;">RTL</a>
    </div>

    <div class="auth-card">

        <!-- Logo -->
        <a href="index.html" class="navbar-brand d-flex justify-content-center align-items-center mb-4 gap-2">
            <i class="ph ph-taxi"></i> LOCAL TAXI
        </a>
        <p class="text-center mb-4" style="font-size: 13px; color: var(--text-secondary);">Create your account to get started</p>

        <form>

            <!-- Full Name -->
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="registerName" placeholder="Your full name">
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" id="registerEmail" placeholder="you@example.com">
            </div>

            <!-- Phone -->
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="registerPhone" placeholder="+1 000 000 0000">
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="registerPassword" placeholder="Create a strong password">
                    <span class="eye-toggle" onclick="togglePassword('registerPassword', this)"><i class="ph ph-eye"></i></span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password">
                    <span class="eye-toggle" onclick="togglePassword('confirmPassword', this)"><i class="ph ph-eye"></i></span>
                </div>
            </div>

            <!-- I Agree Terms -->
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                <label class="form-check-label" for="agreeTerms" style="font-size: 13px; color: var(--text-secondary);">
                    I agree to the <a href="#" class="terms-link">Terms & Conditions</a> and <a href="#" class="terms-link">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mb-4" style="border-radius: 10px; font-size: 15px;">Create Account</button>

            <!-- Divider -->
            <div class="divider">or continue with</div>

            <!-- Social Buttons - bottom -->
            <div class="d-flex gap-2 mb-4">
                <a href="#" class="social-btn" id="googleSignup">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google
                </a>
                <a href="#" class="social-btn" id="appleSignup">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98l-.09.06c-.22.14-2.08 1.21-2.06 3.61.03 2.86 2.51 3.81 2.54 3.82-.03.07-.39 1.35-1.3 2.69M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                    Apple
                </a>
            </div>

            <p class="text-center mb-0" style="font-size: 13px; color: var(--text-secondary);">
                Already have an account? <a href="login.html" class="auth-link">Sign in</a>
            </p>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function togglePassword(fieldId, icon) {
            const field = document.getElementById(fieldId);
            const i = icon.querySelector('i');
            if (field.type === 'password') {
                field.type = 'text';
                i.className = 'ph ph-eye-slash';
            } else {
                field.type = 'password';
                i.className = 'ph ph-eye';
            }
        }
    </script>
</body>
</html>
